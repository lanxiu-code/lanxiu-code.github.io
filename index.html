<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新春红包雨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            touch-action: manipulation;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
        }

        .title {
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff;
            }
            to {
                text-shadow: 0 0 20px #ff4da6, 0 0 30px #ff4da6;
            }
        }

        .red-envelope {
            width: 140px;
            height: 116px;
            background: #e74c3c;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: transform 0.6s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin: 20px auto;
        }

        .red-envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #c0392b;
            border-radius: 10px 10px 0 0;
            transform: rotateX(60deg);
            transform-origin: bottom;
        }

        .red-envelope::after {
            content: '🎁';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            z-index: 2;
        }

        .red-envelope.open {
            transform: rotateX(180deg);
        }

        .amount {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(180deg);
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .amount.show {
            opacity: 1;
        }

        .particles {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.8;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #fff;
            color: #e74c3c;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 80%;
            max-width: 300px;
        }

        .btn:hover, .btn:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .message {
            margin-top: 15px;
            color: #fff;
            font-size: 16px;
            min-height: 24px;
        }

        @media (min-height: 600px) {
            .container {
                margin-top: -50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">新春红包雨</h1>
        <div class="red-envelope" id="envelope">
            <div class="amount" id="amount"></div>
        </div>
        <button class="btn" id="btn">点击开红包</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const envelope = document.getElementById('envelope');
            const amount = document.getElementById('amount');
            const btn = document.getElementById('btn');
            const message = document.getElementById('message');
            let hasOpened = false;

            // 创建红包雨效果
            function createRain() {
                setInterval(() => {
                    if (Math.random() < 0.2) {
                        const rain = document.createElement('div');
                        rain.className = 'particles';
                        rain.style.left = Math.random() * 100 + 'vw';
                        rain.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                        rain.style.width = rain.style.height = Math.random() * 8 + 8 + 'px';
                        document.body.appendChild(rain);
                        
                        // 随机飘落动画
                        const duration = Math.random() * 3 + 2;
                        rain.style.animation = `fall ${duration}s linear forwards`;
                        
                        // 动画结束后移除元素
                        setTimeout(() => {
                            rain.remove();
                        }, duration * 1000);
                    }
                }, 300);
            }

            // 开红包
            function openEnvelope() {
                if (hasOpened) return;
                
                hasOpened = true;
                btn.disabled = true;
                btn.textContent = '已领取';
                
                // 随机金额 1-500
                const randomAmount = (Math.random() * 499 + 1).toFixed(2);
                
                // 金币爆炸特效
                createCoinsEffect();
                
                // 显示金额
                amount.textContent = `¥${randomAmount}`;
                envelope.classList.add('open');
                
                setTimeout(() => {
                    amount.classList.add('show');
                }, 300);
                
                message.textContent = `恭喜！抢到 ${randomAmount} 元红包！`;
            }

            // 金币爆炸特效
            function createCoinsEffect() {
                const colors = ['#f1c40f', '#e67e22', '#e74c3c', '#9b59b6'];
                
                for(let i = 0; i < 40; i++) {
                    setTimeout(() => {
                        const coin = document.createElement('div');
                        coin.className = 'particles';
                        coin.style.left = '50%';
                        coin.style.top = '50%';
                        coin.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                        coin.style.width = coin.style.height = Math.random() * 10 + 5 + 'px';
                        document.body.appendChild(coin);
                        
                        // 随机方向和速度
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 5 + 3;
                        const vx = Math.cos(angle) * speed;
                        const vy = Math.sin(angle) * speed;
                        
                        let x = window.innerWidth / 2;
                        let y = window.innerHeight / 2;
                        
                        const animate = () => {
                            x += vx;
                            y += vy + 0.2; // 重力效果
                            coin.style.left = x + 'px';
                            coin.style.top = y + 'px';
                            
                            // 淡出效果
                            const distance = Math.sqrt((x - window.innerWidth / 2) ** 2 + (y - window.innerHeight / 2) ** 2);
                            coin.style.opacity = 1 - distance / 300;
                            
                            if (y < window.innerHeight && distance < 300) {
                                requestAnimationFrame(animate);
                            } else {
                                coin.remove();
                            }
                        };
                        requestAnimationFrame(animate);
                    }, i * 30);
                }
            }

            // 事件监听 - 支持触摸和点击
            envelope.addEventListener('click', openEnvelope);
            envelope.addEventListener('touchstart', function(e) {
                e.preventDefault();
                openEnvelope();
            });
            
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                if (hasOpened) return;
                openEnvelope();
            });

            // 初始化
            createRain();
        });
    </script>
</body>
</html>
