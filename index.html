<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=0.8"/>
<title>新春红包抽奖</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: linear-gradient(135deg, #ff2d55 0%, #cc0033 100%);
    min-height: 100vh;
  }
  .packet {
    animation: float 3s infinite ease-in-out;
    cursor: pointer;
    transition: all 0.3s;
  }
  .packet:hover {
    transform: scale(1.05);
  }
  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  .gold {
    color: #ffcc00;
  }
  .result-box {
    animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body class="flex flex-col items-center justify-center text-white">

<div class="text-center mt-10 mb-6">
  <h1 class="text-[clamp(28px,6vw,44px)] font-bold gold">🧧 新春红包抽奖</h1>
  <p class="text-white/80 mt-2 text-lg">点击红包，抽取马年好运</p>
</div>

<!-- 红包 -->
<div id="packet" class="packet w-48 h-60 bg-gradient-to-b from-red-500 to-red-700
rounded-2xl shadow-2xl flex flex-col items-center justify-center relative">
  <div class="absolute top-0 w-full h-5 bg-yellow-400 rounded-t-2xl"></div>
  <div class="text-6xl mt-6">🧧</div>
  <div class="mt-4 text-white/90 text-sm">点击开启</div>
</div>

<!-- 结果 -->
<div id="result" class="hidden text-center mt-10 result-box">
  <div class="text-4xl font-bold gold" id="money">¥88</div>
  <p class="mt-2 text-xl">恭喜发财，马年大吉！</p>
  <button id="again" class="mt-6 px-8 py-3 bg-white text-red-600 font-bold rounded-full shadow-lg">
    再抽一次
  </button>
</div>

<script>
  const packet = document.getElementById('packet')
  const result = document.getElementById('result')
  const money = document.getElementById('money')
  const again = document.getElementById('again')

  function random() {
    const luck = [8,18,28,58,68,88,168,188,288]
    if(Math.random() > 0.4) return luck[Math.floor(Math.random()*luck.length)]
    return Math.floor(Math.random() * 300) + 1
  }

  packet.onclick = () => {
    packet.classList.add('hidden')
    result.classList.remove('hidden')
    money.innerText = '¥' + random()
  }

  again.onclick = () => {
    result.classList.add('hidden')
    packet.classList.remove('hidden')
  }
</script>
</body>
</html>
