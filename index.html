<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新春红包雨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .title {
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff;
            }
            to {
                text-shadow: 0 0 20px #ff4da6, 0 0 30px #ff4da6, 0 0 40px #ff4da6;
            }
        }

        .red-envelope {
            width: 120px;
            height: 100px;
            background: #e74c3c;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin: 0 auto;
            animation: float 3s ease-in-out infinite;
        }

        .red-envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #c0392b;
            border-radius: 10px 10px 0 0;
            transform: rotateX(60deg);
            transform-origin: bottom;
        }

        .red-envelope::after {
            content: '🎁';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            z-index: 2;
        }

        .red-envelope.open {
            transform: rotateX(180deg);
        }

        .amount {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(180deg);
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .amount.show {
            opacity: 1;
        }

        .particles {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-20px) rotate(2deg);
            }
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: #fff;
            color: #e74c3c;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .message {
            margin-top: 20px;
            color: #fff;
            font-size: 18px;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">新春红包雨</h1>
        <div class="red-envelope" id="envelope">
            <div class="amount" id="amount"></div>
        </div>
        <button class="btn" id="btn">点击开红包</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const envelope = document.getElementById('envelope');
            const amount = document.getElementById('amount');
            const btn = document.getElementById('btn');
            const message = document.getElementById('message');
            let hasOpened = false;

            // 创建红包雨效果
            function createRain() {
                setInterval(() => {
                    if (Math.random() < 0.3) {
                        const rain = document.createElement('div');
                        rain.className = 'particles';
                        rain.style.left = Math.random() * 100 + 'vw';
                        rain.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                        rain.style.width = rain.style.height = Math.random() * 10 + 10 + 'px';
                        document.body.appendChild(rain);
                        
                        // 动画结束后移除元素
                        rain.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                        setTimeout(() => {
                            rain.remove();
                        }, 5000);
                    }
                }, 300);
            }

            // 开红包
            btn.addEventListener('click', function() {
                if (hasOpened) return;
                
                hasOpened = true;
                btn.disabled = true;
                btn.textContent = '已领取';
                
                // 随机金额
                const randomAmount = (Math.random() * 499 + 1).toFixed(2);
                
                // 添加金币特效
                for(let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        const coin = document.createElement('div');
                        coin.className = 'particles';
                        coin.style.left = '50%';
                        coin.style.top = '50%';
                        coin.style.backgroundColor = '#f1c40f';
                        coin.style.width = coin.style.height = Math.random() * 10 + 5 + 'px';
                        document.body.appendChild(coin);
                        
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 5 + 3;
                        const vx = Math.cos(angle) * speed;
                        const vy = Math.sin(angle) * speed;
                        
                        let x = 50, y = 50;
                        const animate = () => {
                            x += vx;
                            y += vy;
                            coin.style.left = x + 'px';
                            coin.style.top = y + 'px';
                            coin.style.opacity = 1 - y / 100;
                            
                            if (y < 100) {
                                requestAnimationFrame(animate);
                            } else {
                                coin.remove();
                            }
                        };
                        requestAnimationFrame(animate);
                    }, i * 50);
                }
                
                // 显示金额
                amount.textContent = `¥${randomAmount}`;
                envelope.classList.add('open');
                setTimeout(() => {
                    amount.classList.add('show');
                }, 300);
                
                message.textContent = `恭喜！抢到 ${randomAmount} 元红包！`;
                message.style.animation = 'glow 2s ease-in-out';
            });

            // 初始化红包雨
            createRain();
        });
    </script>
</body>
</html>
